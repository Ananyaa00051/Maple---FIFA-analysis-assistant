[project]
name = "fifa-scout-assistant"
version = "0.1.0"
description = "AI-powered FIFA / football data assistant using Groq LLaMA 3.3 + Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "plotly>=5.18.0",
    "groq>=0.5.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
# This is a Streamlit app, not a library — no package directory to ship.
# The wheel target is declared to satisfy hatchling but only deps matter.
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
